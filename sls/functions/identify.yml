handler: dist/identify.handler
memorySize: 1024
timeout: 29
environment:
  USER_POOL_ID: !Ref UserPool
  USER_POOL_CLIENT_ID: !Ref UserPoolClient

package:
  patterns:
    - "!**"
    - "dist/identify.mjs"
events:
  - httpApi:
      path: /uploads
      method: POST
      authorizer:
        name: cognitoJwt
  - httpApi:
      path: /identify
      method: POST
      authorizer:
        name: cognitoJwt
  - httpApi:
      path: /detections
      method: POST
      authorizer:
        name: cognitoJwt
  - httpApi:
      path: /identifications
      method: GET
      authorizer:
        name: cognitoJwt
  - httpApi:
      path: /detections/{detectionId}
      method: GET
      authorizer:
        name: cognitoJwt
  - httpApi:
      path: /detections/{detectionId}
      method: PATCH
      authorizer:
        name: cognitoJwt
  - httpApi:
      path: /detections/{detectionId}
      method: DELETE
      authorizer:
        name: cognitoJwt
