handler: dist/auth.handler
memorySize: 256
timeout: 10
environment:
  USER_POOL_ID: !Ref UserPool
  USER_POOL_CLIENT_ID: !Ref UserPoolClient
  # The hosted domain's token endpoint, where /auth/google exchanges its code.
  COGNITO_DOMAIN: ${self:custom.cognitoDomain}.auth.${self:provider.region}.amazoncognito.com

package:
  patterns:
    - "!**"
    - "dist/auth.mjs"
events:
  - httpApi: "POST /auth/signup"
  - httpApi: "POST /auth/confirm"
  - httpApi: "POST /auth/signin"
  - httpApi: "POST /auth/google"
  - httpApi: "POST /auth/forgot-password"
  - httpApi: "POST /auth/reset-password"
  - httpApi: "POST /auth/refresh"
  - httpApi: "POST /auth/resend-code"
  - httpApi: "POST /auth/signout"
  - httpApi:
      path: /me
      method: GET
      authorizer:
        name: cognitoJwt
