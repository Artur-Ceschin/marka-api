Resources:
  # Plant photos. Private — reads go through presigned URLs, never
  # public bucket access.
  PlantsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: ${self:custom.plantsBucket}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
