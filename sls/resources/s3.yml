Resources:
  PlantsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: ${self:custom.plantsBucket}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      # Required for browser uploads: without it the pre-flight fails and the
      # presigned POST never runs. Native mobile clients ignore CORS, but the
      # web client cannot work without this.
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [POST]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            ExposedHeaders: [ETag]
            MaxAge: 3000

      LifecycleConfiguration:
        Rules:
          # A presigned URL can be requested, used to upload, and then never
          # identified. Those objects are unreachable but still billed, so
          # they expire on their own.
          - Id: expire-unidentified-uploads
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 7
          # Incomplete multipart uploads are invisible in the console and
          # charged until removed.
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
