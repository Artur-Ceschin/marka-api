Resources:
  # Retain guards stack deletion AND replacement. Note it does not make a
  # re-key possible: CloudFormation refuses to replace a resource with an
  # explicit name at all, so changing the key below means renaming the table.
  DetectionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: ${self:custom.detectionsTable}
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: detectionId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: detectionId
          KeyType: RANGE

  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: ${self:custom.usersTable}
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  # Daily identification quota, one row per user per day.
  #
  # Keyed on the date so the counter never needs resetting: a new day is
  # simply a new row, and TTL removes yesterday's. The alternative — a single
  # row per user with a stored date — needs read-modify-write logic to detect
  # the rollover, which is both more code and racy.
  UsageTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    Properties:
      TableName: ${self:custom.usageTable}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: day
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: day
          KeyType: RANGE
      # Rows are disposable counters, so they expire rather than accumulate.
      # No Retain or deletion protection here for the same reason.
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
