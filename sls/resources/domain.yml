Resources:
  ApiDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: ${self:custom.apiDomain}
      DomainNameConfigurations:
        - CertificateArn: ${self:custom.certificateArn}
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    DependsOn: HttpApiStage
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref ApiDomainName
      Stage: "$default"

Outputs:
  ApiDomainTarget:
    Description: "CNAME target — point the custom domain here in Cloudflare"
    Value: !GetAtt ApiDomainName.RegionalDomainName
  ApiCustomUrl:
    Description: "Custom domain URL (works once DNS is pointed)"
    Value: https://${self:custom.apiDomain}
