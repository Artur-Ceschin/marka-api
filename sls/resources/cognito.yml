Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: ${self:custom.userPool}

      UsernameAttributes:
        - email

      AutoVerifiedAttributes:
        - email

      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false

      # This one template serves sign-up, resend AND password reset — Cognito
      # has no separate forgot-password email, hence the neutral wording.
      # Email HTML rules and the palette are documented in CLAUDE.md.
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: "Your Marka verification code"
        EmailMessage: |-
          <!DOCTYPE html>
          <html lang="en">
          <body style="margin:0;padding:0;background-color:#F3F1EA;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F3F1EA;padding:32px 12px;">
          <tr>
          <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;background-color:#FFFFFF;border:1px solid #D4DCD8;border-radius:14px;">
          <tr>
          <td style="padding:32px 36px 8px 36px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
          <div style="font-size:19px;font-weight:500;color:#23422F;letter-spacing:-0.2px;">Marka</div>
          </td>
          </tr>
          <tr>
          <td style="padding:12px 36px 0 36px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
          <h1 style="margin:0 0 14px 0;font-size:22px;line-height:1.3;font-weight:500;color:#23422F;">Your verification code</h1>
          <p style="margin:0;font-size:16px;line-height:1.6;color:#5C6B5F;">Enter this code to continue. It is only valid for a short time — if it stops working, request a new one.</p>
          </td>
          </tr>
          <tr>
          <td style="padding:24px 36px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#23422F;border-radius:6px;">
          <tr>
          <td align="center" style="padding:24px 12px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:32px;font-weight:500;letter-spacing:9px;color:#DFF5C0;">{####}</td>
          </tr>
          </table>
          </td>
          </tr>
          <tr>
          <td style="padding:0 36px 32px 36px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
          <p style="margin:0;padding-top:20px;border-top:1px solid #D4DCD8;font-size:14px;line-height:1.6;color:#5C6B5F;">You are receiving this because this address was entered on markaplant.app. If that was not you, you can ignore this message — nothing will change without the code above.</p>
          </td>
          </tr>
          </table>
          <div style="max-width:520px;padding:18px 8px 0 8px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:14px;line-height:1.5;color:#5C6B5F;">Marka — plant identification. This is an automated message; replies are not monitored.</div>
          </td>
          </tr>
          </table>
          </body>
          </html>

      EmailConfiguration:
        EmailSendingAccount: DEVELOPER
        From: "${self:custom.fromName} <${self:custom.fromEmail}>"
        ConfigurationSet: !Ref EmailConfigurationSet
        SourceArn:
          Fn::Join:
            - ""
            - - "arn:aws:ses:"
              - !Ref AWS::Region
              - ":"
              - !Ref AWS::AccountId
              - ":identity/"
              - !Ref SesDomainIdentity

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: ${self:custom.userPoolClient}
      UserPoolId: !Ref UserPool

      GenerateSecret: false

      # ALLOW_USER_PASSWORD_AUTH is deliberately absent, so the public client
      # id alone cannot trade a password for tokens.
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

      PreventUserExistenceErrors: ENABLED

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
