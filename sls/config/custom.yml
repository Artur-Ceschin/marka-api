# refuses to replace a resource that has an explicit name, so a re-key needs a
# new name. Nothing reads this literal — the env var uses !Ref and IAM !GetAtt.
detectionsTable: ${self:service}-plant-detections-${sls:stage}

apiDomain: api.markaplant.app
certificateArn: arn:aws:acm:us-east-1:058264487329:certificate/8a7230a3-46bd-4844-9c3d-4760a0e93186

userPool: ${self:service}-user-pool-${sls:stage}
userPoolClient: ${self:service}-api-${sls:stage}
usersTable: ${self:service}-users-${sls:stage}

sesDomain: markaplant.app
mailFromDomain: mail.markaplant.app
fromEmail: noreply@markaplant.app
fromName: Marka

emailEventsTopic: ${self:service}-email-events-${sls:stage}
emailConfigSet: ${self:service}-${sls:stage}
