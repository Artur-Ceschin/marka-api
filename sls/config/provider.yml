name: aws
runtime: nodejs22.x
region: us-east-1
profile: marka
architecture: arm64

environment:
  NODE_ENV: production
  PLANTS_BUCKET: !Ref PlantsBucket
  DETECTIONS_TABLE: !Ref DetectionsTable
  USERS_TABLE: !Ref UsersTable
  USER_POOL_ID: !Ref UserPool
  USER_POOL_CLIENT_ID: !Ref UserPoolClient

httpApi:
  cors: true
  # Cognito ID tokens carry `aud`; access tokens carry `client_id` and are
  # rejected here. Clients must send the idToken.
  authorizers:
    cognitoJwt:
      type: jwt
      identitySource: $request.header.Authorization
      issuerUrl:
        Fn::Join:
          - ""
          - - "https://cognito-idp."
            - !Ref AWS::Region
            - ".amazonaws.com/"
            - !Ref UserPool
      audience:
        - !Ref UserPoolClient

iam:
  role:
    # ARNs come from GetAtt, never ${aws:accountId} — the default profile is a
    # different account. Fn::Join not Fn::Sub: Serverless eats ${...} in Sub.
    statements:
      - Effect: Allow
        Action:
          - s3:PutObject
          - s3:GetObject
        Resource:
          Fn::Join: ["", [!GetAtt PlantsBucket.Arn, "/*"]]
      - Effect: Allow
        Action:
          - dynamodb:PutItem
          - dynamodb:GetItem
          - dynamodb:Query
        Resource: !GetAtt DetectionsTable.Arn
      - Effect: Allow
        Action:
          - dynamodb:PutItem
          - dynamodb:GetItem
          - dynamodb:UpdateItem
        Resource: !GetAtt UsersTable.Arn
      - Effect: Allow
        Action:
          - cognito-idp:SignUp
          - cognito-idp:ConfirmSignUp
          - cognito-idp:ResendConfirmationCode
          - cognito-idp:AdminInitiateAuth
          - cognito-idp:AdminGetUser
          - cognito-idp:ForgotPassword
          - cognito-idp:ConfirmForgotPassword
        Resource: !GetAtt UserPool.Arn
