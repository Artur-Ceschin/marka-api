name: aws
runtime: nodejs22.x
region: us-east-1
profile: marka
architecture: arm64

environment:
  NODE_ENV: production
  PLANTS_BUCKET: !Ref PlantsBucket
  DETECTIONS_TABLE: !Ref DetectionsTable
  USERS_TABLE: !Ref UsersTable
  USAGE_TABLE: !Ref UsageTable
  # 10/day. PlantNet's free tier is 500/day shared across everyone, so this
  # supports ~50 daily-active users before the pool runs dry.
  DAILY_IDENTIFY_LIMIT: 10
  USER_POOL_ID: !Ref UserPool
  USER_POOL_CLIENT_ID: !Ref UserPoolClient
  PLANTNET_API_KEY: ${ssm:/marka/${sls:stage}/plantnet-api-key, ''}
  OPENAI_API_KEY: ${ssm:/marka/${sls:stage}/openai-api-key, ''}

httpApi:
  cors: true
  authorizers:
    cognitoJwt:
      type: jwt
      identitySource: $request.header.Authorization
      issuerUrl:
        Fn::Join:
          - ""
          - - "https://cognito-idp."
            - !Ref AWS::Region
            - ".amazonaws.com/"
            - !Ref UserPool
      audience:
        - !Ref UserPoolClient

iam:
  role:
    # ARNs come from GetAtt, never ${aws:accountId} — the default profile is a
    # different account. Fn::Join not Fn::Sub: Serverless eats ${...} in Sub.
    statements:
      - Effect: Allow
        Action:
          - s3:PutObject
          - s3:GetObject
        Resource:
          Fn::Join: ["", [!GetAtt PlantsBucket.Arn, "/*"]]
      - Effect: Allow
        Action:
          - dynamodb:PutItem
          - dynamodb:GetItem
          - dynamodb:Query
        Resource: !GetAtt DetectionsTable.Arn
      - Effect: Allow
        Action:
          - dynamodb:PutItem
          - dynamodb:GetItem
          - dynamodb:UpdateItem
        Resource: !GetAtt UsersTable.Arn
      - Effect: Allow
        Action:
          - dynamodb:UpdateItem
        Resource: !GetAtt UsageTable.Arn
      - Effect: Allow
        Action:
          - cognito-idp:SignUp
          - cognito-idp:ConfirmSignUp
          - cognito-idp:ResendConfirmationCode
          - cognito-idp:AdminInitiateAuth
          - cognito-idp:AdminGetUser
          - cognito-idp:ForgotPassword
          - cognito-idp:ConfirmForgotPassword
        Resource: !GetAtt UserPool.Arn
