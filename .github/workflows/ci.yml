name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Reads packageManager from package.json, so the version cannot drift.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # --frozen-lockfile fails if the lockfile is out of date, rather than
      # quietly resolving different versions than a developer has locally.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # Builds the bundles and runs them, so a bundling regression fails here
      # rather than at a Lambda cold start.
      - run: pnpm test:bundle
