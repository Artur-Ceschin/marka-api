service: marka-api

custom: ${file(./sls/config/custom.yml)}

provider: ${file(./sls/config/provider.yml)}

package:
  individually: true

functions:
  health: ${file(./sls/functions/health.yml)}
  auth: ${file(./sls/functions/auth.yml)}
  identify: ${file(./sls/functions/identify.yml)}
  postConfirmation: ${file(./sls/functions/cognitoTriggers.yml)}
  preSignUp:
    handler: dist/cognitoTriggers.preSignUp
    memorySize: 256
    timeout: 5
    package:
      patterns:
        - "!**"
        - "dist/cognitoTriggers.mjs"

resources:
  - ${file(./sls/resources/s3.yml)}
  - ${file(./sls/resources/dynamodb.yml)}
  - ${file(./sls/resources/cognito.yml)}
  - ${file(./sls/resources/ses.yml)}
  - ${file(./sls/resources/domain.yml)}
